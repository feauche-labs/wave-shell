# Выпуск Wave Shell через release-please (как в Wave).
# Каждый пуш в main → release-please готовит PR «chore: подготовить релиз X.Y.Z»: номер версии во всех файлах
# (release-please-config.json → extra-files) и CHANGELOG.md. PR влит → метка vX.Y.Z и ЧЕРНОВИК релиза →
# установщики для macOS (Apple Silicon и Intel), Windows и Linux → файлы прикладываются → релиз публикуется.
# Пока файлы собираются, релиз — черновик, поэтому ссылки «Скачать» в README никогда не ведут в пустоту.
# Сборка — как в release.yml iBC Shell: имена файлов постоянные, платной подписи нет (macOS ad-hoc «-»,
# Windows без подписи). Сторонние действия закреплены по SHA (метка версии — в комментарии).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` too: the self-update package for macOS is the zipped .app (`*.app.tar.gz` + `.sig`).
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Linux system deps (Tauri / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches the app version
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$TAG" ]; then
            echo "метка $TAG не совпадает с версией v$app в tauri.conf.json" >&2
            exit 1
          fi

      - name: Build installers
        env:
          # Updater signing key (`createUpdaterArtifacts`): every update package gets a `.sig`; the app installs
          # only packages signed with this key. Repository secrets, see README → «Автообновление».
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          bundle="target/${{ matrix.target }}/release/bundle"
          # Постоянные имена: README ссылается на releases/latest/download/<имя>.
          # Wave: рядом — пакеты автообновления и их подписи (.sig); подпись не зависит от имени файла.
          one() { # one <маска> <имя в релизе>: ровно один файл, иначе ошибка
            local found; found=$(find "$bundle" -name "$1" -print)
            [ "$(printf '%s\n' "$found" | grep -c .)" = 1 ] || { echo "ожидался один файл $1, найдено: $found" >&2; exit 1; }
            cp "$found" "dist/$2"
          }
          case "${{ matrix.name }}" in
            macos-arm64)
              one '*.dmg' Wave-Shell-macOS-Apple-Silicon.dmg
              one '*.app.tar.gz' Wave-Shell-macOS-Apple-Silicon.app.tar.gz
              one '*.app.tar.gz.sig' Wave-Shell-macOS-Apple-Silicon.app.tar.gz.sig ;;
            macos-x64)
              one '*.dmg' Wave-Shell-macOS-Intel.dmg
              one '*.app.tar.gz' Wave-Shell-macOS-Intel.app.tar.gz
              one '*.app.tar.gz.sig' Wave-Shell-macOS-Intel.app.tar.gz.sig ;;
            windows-x64)
              one '*-setup.exe' Wave-Shell-Windows-x64-setup.exe
              one '*-setup.exe.sig' Wave-Shell-Windows-x64-setup.exe.sig ;;
            linux-x64)
              one '*.AppImage' Wave-Shell-Linux-x64.AppImage
              one '*.AppImage.sig' Wave-Shell-Linux-x64.AppImage.sig
              one '*.deb' Wave-Shell-Linux-x64.deb
              one '*.deb.sig' Wave-Shell-Linux-x64.deb.sig ;;
          esac
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wave-shell-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Update manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # Wave: what the app's updater reads (plugins.updater.endpoints → releases/latest/download/latest.json).
          # Keys are <os>-<arch>, plus <os>-<arch>-<installer> so a .deb install updates with the .deb;
          # a signature is the content of the matching .sig file.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          entry() { jq -n --arg s "$(cat "dist/$1.sig")" --arg u "$base/$1" '{signature: $s, url: $u}'; }
          jq -n --arg v "${TAG#v}" --arg n "$notes" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson ma "$(entry Wave-Shell-macOS-Apple-Silicon.app.tar.gz)" \
            --argjson mi "$(entry Wave-Shell-macOS-Intel.app.tar.gz)" \
            --argjson wi "$(entry Wave-Shell-Windows-x64-setup.exe)" \
            --argjson la "$(entry Wave-Shell-Linux-x64.AppImage)" \
            --argjson ld "$(entry Wave-Shell-Linux-x64.deb)" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {
              "darwin-aarch64": $ma, "darwin-aarch64-app": $ma,
              "darwin-x86_64": $mi, "darwin-x86_64-app": $mi,
              "windows-x86_64": $wi, "windows-x86_64-nsis": $wi,
              "linux-x86_64": $la, "linux-x86_64-appimage": $la, "linux-x86_64-deb": $ld}}' > dist/latest.json
          jq '.platforms |= map_values(.url)' dist/latest.json

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Wave Shell ${TAG#v}" --draft=false --latest
