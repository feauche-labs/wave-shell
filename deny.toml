[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa Marvin timing attack: no upstream fix. We only sign locally with the user's own RSA key
  # (no remote party can time a decryption oracle). Revisit when russh moves to a fixed rsa.
  { id = "RUSTSEC-2023-0071", reason = "client-side signing only, no decryption oracle exposed" },
  # Unmaintained proc-macros pulled by specta (build time only, no runtime code).
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc macro via specta" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time proc macro" },
  # zbus helpers (Linux D-Bus, via tauri-plugin-notification → notify-rust; ADR-017). Unmaintained
  # notices only, no known vulnerability; only used to post a notification on the session bus.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux notification D-Bus only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux notification D-Bus only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux notification D-Bus only" },
  # Wave: chrono declared unmaintained (17.11.2026), no fixed version. Not ours: russh-util (inside russh)
  # and russh-sftp use it for timestamps. Unmaintained notice only, no known vulnerability. Revisit when
  # russh / russh-sftp move to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "chrono: via russh-util and russh-sftp only, no vulnerability" },
]

[licenses]
version = 2
# Wave: CDLA-Permissive-2.0 — permissive data licence of the Mozilla root certificates (webpki-root-certs),
# pulled by reqwest's platform verifier once tauri-plugin-updater turns on its TLS.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
