[package]
name = "ibc-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "ibc-shell"

[lib]
name = "ibc_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
secrecy.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
ibc-shell-store.workspace = true
ibc-shell-vault.workspace = true
ibc-shell-ssh.workspace = true
ibc-shell-sftp.workspace = true
zeroize.workspace = true
# Prompt timeouts + oneshot/mpsc in the session pump (rt is provided by Tauri).
tokio = { workspace = true, features = ["time", "sync", "macros", "net"] }
tauri-plugin-dialog = "2"
# System notifications when a background command finishes (ADR-017); shown by the backend.
tauri-plugin-notification = "2"

# Local terminal (ADR-017): login shell in a PTY; MIT, the PTY layer of WezTerm.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
# Wave: self-update from our GitHub releases (signed with our key; latest.json in every release) and the
# relaunch after it. Desktop only.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# ADR-018: private document copies.
tempfile = "3"
# Wave: the system window buttons follow the left menu (hidden with it, like in Arc). Safe calls only —
# the window is found by address among NSApp's windows. Already in the tree through tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
[target.'cfg(windows)'.dependencies]
# ShellExecute expects ordinary Windows paths where possible.
dunce = "1"
# ADR-018: native file associations via ShellExecute.
open = { version = "5", features = ["shellexecute-on-windows"] }

[lints]
workspace = true
